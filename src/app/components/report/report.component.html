<div class="min-h-screen bg-gray-100 p-4 sm:ml-64">
  <div class="max-w-7xl mx-auto">
    <!-- Main Card -->
    <div class="bg-white shadow-xl rounded-2xl p-8 mt-16">
      <h1 class="text-2xl font-bold text-gray-800 mb-6">Generate Farm Reports</h1>

      <!-- Report Generation Form -->
      <form [formGroup]="reportForm" (ngSubmit)="onDownload()" class="space-y-6">
        <!-- Header and Description -->
        <div>
          <p class="text-gray-600 text-sm">Select report type and filters to generate or preview insights for your polytunnels and plants.</p>
        </div>

        <!-- Filters Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <!-- Start Date -->
          <div>
            <label for="startDate" class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
            <input
              type="date"
              id="startDate"
              formControlName="startDate"
              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
              [ngClass]="{'border-red-500': isFieldInvalid('startDate')}"
            />
            <p *ngIf="isFieldInvalid('startDate')" class="text-red-500 text-xs mt-1">
              Start date is required
            </p>
          </div>

          <!-- End Date -->
          <div>
            <label for="endDate" class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
            <input
              type="date"
              id="endDate"
              formControlName="endDate"
              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
              [ngClass]="{'border-red-500': isFieldInvalid('endDate')}"
            />
            <p *ngIf="isFieldInvalid('endDate')" class="text-red-500 text-xs mt-1">
              End date is required
            </p>
          </div>

          <!-- Polytunnel Filter -->
          <div>
            <label for="plotId" class="block text-sm font-medium text-gray-700 mb-1">Polytunnel (Optional)</label>
            <select
              id="plotId"
              formControlName="plotId"
              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
            >
              <option value="">All Polytunnels</option>
              <option *ngFor="let plot of polytunnels" [value]="plot.code">{{ plot.code }} - {{ plot.location }}</option>
            </select>
          </div>

          <!-- Plant Filter -->
          <div>
            <label for="plantId" class="block text-sm font-medium text-gray-700 mb-1">Plant (Optional)</label>
            <select
              id="plantId"
              formControlName="plantId"
              class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
            >
              <option value="">All Plants</option>
              <option *ngFor="let plant of plants" [value]="plant.plantName">{{ plant.plantName }}</option>
            </select>
          </div>
        </div>

        <div>
          <label for="reportType" class="block text-sm font-medium text-gray-700 mb-1">Report Type</label>
          <select
            id="reportType"
            formControlName="reportType"
            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200"
            [ngClass]="{'border-red-500': isFieldInvalid('reportType')}"
          >
            <option value="" disabled>Select a report type</option>
            <option value="polytunnel">Polytunnel Performance</option>
            <option value="plant">Plant Growth & Yield</option>
            <option value="irrigation">Irrigation Efficiency</option>
            <option value="financial">Financial Performance</option>
          </select>
          <p *ngIf="isFieldInvalid('reportType')" class="text-red-500 text-xs mt-1">
            Please select a report type
          </p>
        </div>

        <div class="flex justify-end space-x-4">
          <button
            type="button"
            (click)="onReset()"
            class="px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 focus:ring-4 focus:ring-red-300 transition duration-200"
          >
            Clear
          </button>
          <button
            type="submit"
            [disabled]="isSubmitting || reportForm.invalid"
            class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 focus:ring-4 focus:ring-green-300 transition duration-200 disabled:bg-gray-400"
          >
            {{ isSubmitting ? 'Generating...' : 'Download' }}
          </button>
        </div>
      </form>

      <!-- Report Preview Section -->
      <div *ngIf="previewData" class="mt-8">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">Report Preview</h2>
        <div class="bg-gray-50 p-6 rounded-lg">
          <pre class="text-sm text-gray-700">{{ previewData | json }}</pre>
        </div>
      </div>
      <div *ngIf="errorMessage" class="mt-4 text-red-500 text-sm">{{ errorMessage }}</div>
    </div>
  </div>
</div>
